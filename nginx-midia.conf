# Configuração Nginx com suporte a SSL (Let's Encrypt), SSE (Tempo Real) e WebSockets
# Arquivo: /etc/nginx/sites-available/midia-indoor

server {
    listen 80;
    server_name midia.seudominio.com.br;

    # Aumentar limite para upload de vídeos e imagens (100MB)
    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
    }

    # Rota de Eventos em Tempo Real (Server-Sent Events para Chamada de Senhas e Heartbeats)
    location /api/realtime/stream {
        proxy_pass http://127.0.0.1:3000/api/realtime/stream;
        proxy_http_version 1.1;

        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Desativa buffers para que o sinal de chamada de senha chegue na TV instantaneamente
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
